Base:
    model_root: './checkpoints/'
    num_workers: 4
    verbose: 1
    early_stop_patience: 2
    pickle_feature_encoder: True
    save_best_only: True
    eval_steps: null
    debug_mode: False
    group_id: user_id
    use_features: null
    feature_specs: null
    feature_config: null
    dense_optimizer: AdamW
    sparse_optimizer: Adagrad
    dense_learning_rate: 1.0e-4
    sparse_learning_rate: 0.05
    dense_weight_decay: 0
    enable_torch_compile: False
    gradient_checkpointing: False

RankMixer_KuaiRand_Video_Action:
    model: RankMixer
    dataset_id: KuaiRand_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    num_tasks: 6
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    num_layers: 3
    expansion_factor: 2
    token_dim: 256
    num_ns_token: 4
    tokenizer_type: Chunk
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    attention_dropout: 0
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1

LONGER_KuaiRand_Video_Action: # This is a config template
    model: LONGER
    dataset_id: KuaiRand_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    tower_hidden_units: [128, 64]
    num_tasks: 6
    num_ns_token: 4
    num_groups: 4
    query_size: 10
    num_layers: 3
    num_heads: 2
    token_dim: 256
    dnn_activations: ReLU
    tower_activations: ReLU
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1

TokenMixer_KuaiRand_Video_Action: # This is a config template
    model: TokenMixer
    dataset_id: KuaiRand_Video_Action
    loss: ['binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy', 'binary_crossentropy']
    num_tasks: 6
    metrics: ['logloss', 'AUC']
    task: binary_classification
    batch_size: 8192
    embedding_dim: 16
    num_layers: 3
    expansion_factor: 2
    token_dim: 256
    num_group_token: 4
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    attention_dropout: 0
    net_dropout: 0
    epochs: 1
    shuffle: True
    seed: 20262027
    monitor: {'AUC': 1, 'logloss': 0}
    monitor_mode: 'max'
    max_len: 100
    accumulation_steps: 1


# LONGER 历史建模 + RankMixer 特征交互。
LONGER_RankMixer_NoMixer_KuaiRand_Video_Action: &longer_readout_base
    model: LONGER_RankMixer
    dataset_id: KuaiRand_Video_Action
    task: binary_classification
    num_tasks: 6
    loss: [binary_crossentropy, binary_crossentropy, binary_crossentropy, binary_crossentropy, binary_crossentropy, binary_crossentropy]
    metrics: [logloss, AUC]
    monitor: {AUC: 1, logloss: 0}
    monitor_mode: max
    embedding_dim: 16
    token_dim: 256
    max_len: 100
    num_groups: 4
    query_size: 10
    num_global_tokens: 4
    num_rank_tokens: 8   # 将拼接特征转换成多少个 token
    num_heads: 2
    longer_num_layers: 1
    longer_expansion_factor: 4
    rankmixer_num_layers: 0   # RankMixer 交互层的数量
    rankmixer_expansion_factor: 2
    dnn_activations: ReLU
    tower_hidden_units: [128, 64]
    tower_activations: ReLU
    net_dropout: 0
    batch_size: 128
    accumulation_steps: 8
    epochs: 1
    shuffle: true
    seed: 20262027
    enable_torch_compile: false
    gradient_checkpointing: false

LONGER_RankMixer_Dense_KuaiRand_Video_Action:
    <<: *longer_readout_base
    rankmixer_num_layers: 1
    rankmixer_num_experts: 0

LONGER_RankMixer_KuaiRand_Video_Action:
    <<: *longer_readout_base
    rankmixer_num_layers: 1    # RankMixer 交互层的数量
    rankmixer_num_experts: 4  # 每个 token 有 4 个专家，train 和 infer 路由共享专家参数。
    rankmixer_l1_lambda: 0.01  # 仅用于 infer 路由的稀疏正则，在模型总损失中计入一次。
